name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Repository hygiene
        run: python3 scripts/validate_repository_hygiene.py

      - name: Repository structure and anti-drift
        run: python3 scripts/validate_structure.py

      - name: Format check
        run: cargo fmt --check

      - name: Workspace check
        run: cargo check --workspace --locked

      - name: Test collection non-vacuity
        run: python3 scripts/validate_test_collection.py

      - name: Tests
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build and smoke production artifact
        run: python3 scripts/validate_release_artifact.py

      - name: Upload release artifact evidence
        uses: actions/upload-artifact@v7
        with:
          name: arbyclaw-release-artifact
          path: target/release-artifacts/
          if-no-files-found: error

      - name: Install supply-chain tools
        run: cargo install cargo-audit cargo-cyclonedx --locked

      - name: Dependency audit
        run: cargo audit

      - name: Generate ephemeral CycloneDX SBOM
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --license-accept-named UNLICENSED --override-filename arbyclaw.cdx
          test -s crates/arb-core/arbyclaw.cdx.json
          test -s crates/arb-agent/arbyclaw.cdx.json
          rm crates/arb-core/arbyclaw.cdx.json crates/arb-agent/arbyclaw.cdx.json

      - name: Top local handoff/hardening gate
        run: python3 scripts/validate_agentic_handoff_candidate_gate.py --json

  codeql-sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust

      - name: CodeQL analysis
        uses: github/codeql-action/analyze@v4

  secret-pattern-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --redact --report-format=json --report-path=/repo/gitleaks-secret-scan.json

      - name: Upload secret scan evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-secret-scan
          path: gitleaks-secret-scan.json
          if-no-files-found: warn

      - name: Remove generated secret scan evidence
        if: always()
        run: rm -f gitleaks-secret-scan.json
