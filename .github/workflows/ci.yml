name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  rust:
    name: rust-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --check
      - name: Workspace check
        run: cargo check --workspace
      - name: Tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Locked release build
        run: cargo build --release --locked
      - name: Install hardening tools
        run: cargo install cargo-audit cargo-cyclonedx --locked
      - name: Dependency audit
        run: cargo audit
      - name: Generate CycloneDX SBOM
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --license-accept-named UNLICENSED --override-filename arbyclaw.cdx
          test -s crates/arb-core/arbyclaw.cdx.json
          test -s crates/arb-agent/arbyclaw.cdx.json
          rm crates/arb-core/arbyclaw.cdx.json crates/arb-agent/arbyclaw.cdx.json
      - name: Repository structure validation
        run: python3 scripts/validate_structure.py

  codeql:
    name: codeql-sast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
          queries: security-extended
      - name: CodeQL analysis
        uses: github/codeql-action/analyze@v4
